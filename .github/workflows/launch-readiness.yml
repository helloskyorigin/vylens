name: VYLENS final launch browser QA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Python Playwright package
        run: python -m pip install playwright==1.56.0
      - name: Wait for updated landing page on production
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 45); do
            if curl --max-time 12 -fsSL 'https://vylens-tan.vercel.app/' -o /tmp/vylens-site.html && grep -q 'up to 24 pages per scan' /tmp/vylens-site.html; then ready=1; break; fi
            sleep 6
          done
          test "$ready" -eq 1
      - name: Run end-to-end production browser QA
        run: python qa_launch_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vylens-launch-screenshots
          path: qa-captures/
          retention-days: 7
