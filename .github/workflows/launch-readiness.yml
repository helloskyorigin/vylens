name: VYLENS final launch browser QA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ui:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Python Playwright package
        run: python -m pip install playwright==1.56.0
      - name: Pixel and interaction QA against local Results build
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/vylens-results-static.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS 'http://127.0.0.1:8765/results.html' -o /dev/null; then break; fi
            sleep 1
          done
          VYLENS_BASE=http://127.0.0.1:8765 python qa_conversion_results.py
      - name: Verify latest Results and scanner assets on production
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 24); do
            if curl --max-time 12 -fsSL 'https://vylens-tan.vercel.app/api/inspect-site' -o /tmp/vylens-health.json &&
               python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); sys.exit(0 if d.get("engine")=="bounded-playwright-crawl" and d.get("deploymentCommit")==sys.argv[2] else 1)' /tmp/vylens-health.json "$GITHUB_SHA"; then
              matches=1
              for asset in results.html results-showcase.js results-showcase.css results-seven.js results-seven.css results-five.js results-pdf.js analysis.js analysis.css inspect.html; do
                if ! curl --max-time 12 -fsSL "https://vylens-tan.vercel.app/$asset" -o "/tmp/vylens-live-${asset//\//-}" ||
                   ! cmp -s "$asset" "/tmp/vylens-live-${asset//\//-}"; then
                  matches=0
                  break
                fi
              done
              if [ "$matches" -eq 1 ]; then ready=1; break; fi
            fi
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then
            echo 'Production health or exact Results/scan asset contents could not be verified.'
            exit 1
          fi
          echo 'Production serves the current commit Results and scan assets.'
      - name: Test local digital-product audit and ZIP safety regressions
        run: python qa_product_browser.py
      - name: Run end-to-end production browser QA
        run: python qa_launch_browser.py
      - name: Test focused Results at desktop and mobile widths
        run: python qa_focus_results.py
      - name: Test zero, partial, long and paginated Results states
        run: python qa_results_states.py
      - name: Test scan 429 cooldown and retry recovery
        run: python qa_retry_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vylens-launch-screenshots
          path: qa-captures/
          retention-days: 7
