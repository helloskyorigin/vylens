name: VYLENS final launch browser QA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ui:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Python Playwright package
        run: python -m pip install playwright==1.56.0
      - name: Wait for updated landing page on production
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 45); do
            if curl --max-time 12 -fsSL 'https://vylens-tan.vercel.app/api/inspect-site' -o /tmp/vylens-health.json && jq -e --arg sha "$GITHUB_SHA" '.engine=="bounded-playwright-crawl" and .deploymentCommit==$sha' /tmp/vylens-health.json >/dev/null; then ready=1; break; fi
            sleep 6
          done
          if [ "$ready" -ne 1 ]; then echo 'Latest commit not yet confirmed on production (requires Vercel system env vars).'; exit 1; fi
      - name: Test local digital-product audit and ZIP safety regressions
        run: python qa_product_browser.py
      - name: Run end-to-end production browser QA
        run: python qa_launch_browser.py
      - name: Test focused red/green Results at desktop and mobile widths
        run: python qa_focus_results.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vylens-launch-screenshots
          path: qa-captures/
          retention-days: 7
