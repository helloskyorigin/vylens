name: VYLENS Playwright real-site smoke
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install scanner dependencies for unit tests
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Validate frontend and scanner JavaScript syntax
        run: |
          node --check results.js
          node --check conversion-results.js
          node --check results-lime.js
          node --check lib/conversion-engine.mjs
          node --check lib/buyer-experience.mjs
          node --check results-five.js
          node --check results-pdf.js
          node --check analysis.js
          node --check script.js
          node --check audit-core.js
          node --check api/inspect-site.mjs
          node --check api/inspect.mjs
      - name: Test crawl accuracy, legal-page heuristics and result counts
        run: node qa_multisite_accuracy.mjs
      - name: Test conversion-blocker analysis, evidence and false positives
        run: node qa_conversion_engine.mjs
      - name: Test Buyer Journey Replay and Conversion Fix Kit
        run: node qa_buyer_experience.mjs
      - name: Test evidence-first problem engine and metadata accuracy
        run: node qa_problem_engine.mjs
      - name: Test actual rendered DOM fixtures in Chromium
        run: node qa_rendered_fixture.mjs
      - name: Verify deployed browser-audit endpoint
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://vylens-tan.vercel.app"
          ready=0
          for attempt in $(seq 1 36); do
            code=$(curl -sS --max-time 12 -o /tmp/browser-health.json -w '%{http_code}' "$BASE/api/inspect-site" || true)
            if [ "$code" = "200" ] && jq -e --arg sha "$GITHUB_SHA" '.engine=="bounded-playwright-crawl" and .auditRevision=="problem-engine-v4" and .pageLimit>=20 and .deploymentCommit==$sha' /tmp/browser-health.json >/dev/null 2>&1; then
              ready=1; break
            fi
            sleep 6
          done
          if [ "$ready" -ne 1 ]; then
            echo "FAIL: exact pushed Git commit not confirmed live (check deployment and system env vars)."
            cat /tmp/browser-health.json || true
            exit 1
          fi
          echo "PASS: browser-audit endpoint is live."
      - name: Audit a real multi-page site and legal pages
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://vylens-tan.vercel.app"
          status=$(curl -sS --max-time 155 -o /tmp/browser-scan.json -w '%{http_code}' -X POST "$BASE/api/inspect-site" \
            -H 'content-type: application/json' \
            -H 'origin: https://vylens-tan.vercel.app' \
            -H 'sec-fetch-site: same-origin' \
            --data '{"url":"https://vylens-tan.vercel.app/"}')
          echo "Scan response HTTP $status"
          if [ "$status" != "200" ]; then
            head -c 1600 /tmp/browser-scan.json
            exit 1
          fi
          jq '{engine,coverage, pages:[.pages[]|{path,status}], findings:(.issues|length),checksRun}' /tmp/browser-scan.json | head -c 8000
          jq -e '.mode=="website" and .engine=="vylens-playwright-v1" and .coverage.inspected>=3 and .coverage.rendered>=2 and .coverage.legal>=1 and (.issues|type=="array") and (.checksRun>170) and ([.checks[].name | contains("Rendered control names")] | any) and ([.checks[].name | contains("Measurable text contrast")] | any) and ([.checks[].name | contains("Readable rendered content")] | any) and ([.checks[].name | contains("Narrow-phone layout (320px)")] | any) and (.reportCounts.distinctFindings==(.issues|length)) and (.reportCounts.checksByStatus.not_applicable>=0)' /tmp/browser-scan.json >/dev/null
          echo "PASS: real Playwright rendered multiple pages including at least one legal page."
